<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Food Point Finder - Login</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Product+Sans:wght@400;500;700&family=Roboto:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <link rel="stylesheet" href="../styles/restaurant.css" />
    <link rel="stylesheet" href="../styles/login.css" />
    <link rel="stylesheet" href="../styles/navbar.css" />
    <link rel="stylesheet" href="../styles/signup.css" />
  </head>

  <body>
    <!-- Navigation Bar -->
    <nav class="navbar">
      <div class="navbar-container">
        <div class="navbar-brand">
          <a href="../index.html" class="logo"
            ><i class="fa-solid fa-location-dot">&nbsp;</i>Food Point Finder</a
          >
          <div class="tagline">Travel-Based Food Discovery Platform</div>
        </div>

        <div class="navbar-menu">
          <ul class="navbar-nav">
            <li><a href="restaurants.html" class="nav-link">Restaurants</a></li>
          </ul>
        </div>

        <div class="navbar-actions">
          <div class="auth-buttons">
            <a href="login.html" class="btn btn-login active">Login</a>
            <a href="signup.html" class="btn btn-signup">Sign Up</a>
            <a href="../index.html" class="nav-link">Home</a>
          </div>
        </div>

        <button class="mobile-menu-toggle" onclick="toggleMobileMenu()">
          <i class="fas fa-bars"></i>
        </button>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
      <h1 class="page-title">Welcome Back</h1>

      <div class="login-container">
        <div id="error-message"></div>
        <div id="success-message"></div>
        <form class="login-form" onsubmit="handleLogin(event)">
          <div class="form-group">
            <label for="email">Email Address</label>
            <input
              type="email"
              id="email"
              name="email"
              required
              placeholder="Enter your email"
            />
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              required
              placeholder="Enter your password"
            />
          </div>

          <div class="remember-forgot">
            <label class="remember-me">
              <input type="checkbox" name="remember" /> Remember me
            </label>
            <a href="#" class="forgot-password">Forgot Password?</a>
          </div>

          <button type="submit" class="submit-btn">Log In</button>
        </form>

        <div class="social-login">
          <p>Or log in with</p>
          <div class="social-buttons">
            <button class="social-btn" onclick="handleGoogleLogin()">
              <i class="fab fa-google"></i>
              Google
            </button>
            <button class="social-btn" onclick="handleFacebookLogin()">
              <i class="fab fa-facebook"></i>
              Facebook
            </button>
          </div>
        </div>

        <div class="signup-link">
          Don't have an account? <a href="signup.html">Sign up</a>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <div class="footer-content">
        <div class="footer-links">
          <a href="#" class="footer-link">About Us</a>
          <a href="#" class="footer-link">Privacy Policy</a>
          <a href="#" class="footer-link">Contact & Support</a>
        </div>
        <a href="mailto:foodpointfinder@gmail.com" class="footer-email">
          <i class="fas fa-envelope"></i> foodpointfinder@gmail.com
        </a>
        <div class="footer-copyright">
          © 2024 Food Point Finder. All rights reserved.
        </div>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../config/supabaseclient.js"></script>
    <script src="../js/shared.js"></script>
    <script src="../js/login.js"></script>
    
  </body>
</html>
