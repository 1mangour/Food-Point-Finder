<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Point Finder - Login</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Product+Sans:wght@400;500;700&family=Roboto:wght@300;400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/styles/restaurant.css">
    <style>
        .login-container {
            max-width: 400px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 2px 12px rgba(32,33,36,.15);
            border: 1px solid #f0f0f0;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-size: 14px;
            font-weight: 500;
            color: #3c4043;
        }

        .form-group input {
            padding: 12px;
            border: 1px solid #dadce0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #1a73e8;
            box-shadow: 0 0 0 2px rgba(26,115,232,0.2);
        }

        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #5f6368;
        }

        .forgot-password {
            color: #1a73e8;
            text-decoration: none;
            font-weight: 500;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        .submit-btn {
            background: #1a73e8;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 24px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background: #1557b0;
            box-shadow: 0 2px 6px rgba(26,115,232,0.3);
        }

        .social-login {
            margin-top: 30px;
            text-align: center;
        }

        .social-login p {
            color: #5f6368;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .social-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .social-btn {
            padding: 12px 24px;
            border: 1px solid #dadce0;
            border-radius: 24px;
            background: white;
            color: #3c4043;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .social-btn:hover {
            background: #f8f9fa;
            border-color: #1a73e8;
        }

        .signup-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #5f6368;
        }

        .signup-link a {
            color: #1a73e8;
            text-decoration: none;
            font-weight: 500;
        }

        .signup-link a:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .login-container {
                margin: 20px;
                padding: 20px;
            }

            .social-buttons {
                flex-direction: column;
            }

            .social-btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>

<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="navbar-container">
            <div class="navbar-brand">
                <a href="../index.html" class="logo"><i class="fa-solid fa-location-dot">&nbsp;</i>Food Point Finder</a>
                <div class="tagline">Travel-Based Food Discovery Platform</div>
            </div>

            <div class="navbar-menu">
                <ul class="navbar-nav">
                    <li><a href="restaurants.html" class="nav-link">Restaurants</a></li>
                </ul>
            </div>

            <div class="navbar-actions">
                <div class="auth-buttons">
                    <a href="login.html" class="btn btn-login active">Login</a>
                    <a href="signup.html" class="btn btn-signup">Sign Up</a>
                    <a href="../index.html" class="nav-link">Home</a>
                </div>
            </div>

            <button class="mobile-menu-toggle" onclick="toggleMobileMenu()">
                <i class="fas fa-bars"></i>
            </button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <h1 class="page-title">Welcome Back</h1>

        <div class="login-container">
            <form class="login-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required placeholder="Enter your email">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="Enter your password">
                </div>

                <div class="remember-forgot">
                    <label class="remember-me">
                        <input type="checkbox" name="remember"> Remember me
                    </label>
                    <a href="#" class="forgot-password">Forgot Password?</a>
                </div>

                <button type="submit" class="submit-btn">Log In</button>
            </form>

            <div class="social-login">
                <p>Or log in with</p>
                <div class="social-buttons">
                    <button class="social-btn">
                        <i class="fab fa-google"></i>
                        Google
                    </button>
                    <button class="social-btn">
                        <i class="fab fa-facebook"></i>
                        Facebook
                    </button>
                </div>
            </div>

            <div class="signup-link">
                Don't have an account? <a href="signup.html">Sign up</a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-content">
            <div class="footer-links">
                <a href="#" class="footer-link">About Us</a>
                <a href="#" class="footer-link">Privacy Policy</a>
                <a href="#" class="footer-link">Contact & Support</a>
            </div>
            <a href="mailto:foodpointfinder@gmail.com" class="footer-email">
                <i class="fas fa-envelope"></i> foodpointfinder@gmail.com
            </a>
            <div class="footer-copyright">
                © 2024 Food Point Finder. All rights reserved.
            </div>
        </div>
    </footer>

    <script>
        // Mobile menu toggle
        function toggleMobileMenu() {
            const mobileMenu = document.getElementById('mobileMenu');
            const toggleButton = document.querySelector('.mobile-menu-toggle i');

            mobileMenu.classList.toggle('active');

            if (mobileMenu.classList.contains('active')) {
                toggleButton.classList.remove('fa-bars');
                toggleButton.classList.add('fa-times');
            } else {
                toggleButton.classList.remove('fa-times');
                toggleButton.classList.add('fa-bars');
            }
        }

        // Form submission handler
        function handleLogin(event) {
            event.preventDefault();
            
            // Here you would typically send the form data to your backend
            alert('Login successful! (Demo only)');
            // Optionally redirect to home page
            // window.location.href = '../index.html';
        }

        // Close mobile menu when clicking outside
        document.addEventListener('click', function(event) {
            const mobileMenu = document.getElementById('mobileMenu');
            const toggleButton = document.querySelector('.mobile-menu-toggle');

            if (!event.target.closest('.navbar') && mobileMenu.classList.contains('active')) {
                mobileMenu.classList.remove('active');
                const icon = toggleButton.querySelector('i');
                icon.classList.remove('fa-times');
                icon.classList.add('fa-bars');
            }
        });
    </script>
</body>

</html>
